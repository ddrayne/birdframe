<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>%%TITLE%%</title>
  <meta name="description" content="%%DESCRIPTION%%">
  <meta property="og:title" content="%%TITLE%%">
  <meta property="og:description" content="%%DESCRIPTION%%">
  <meta property="og:image" content="%%OG_IMAGE%%">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#091412">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="assets/site.css?v=%%CSS_V%%">
</head>
<body>
  <a class="skip" href="#main">Skip to the journal</a>
  <header class="masthead" id="masthead">
    <a class="wordmark" href="#home"><span>%%TITLE%%</span></a>
    <nav aria-label="Sections">
      <a href="#home" data-nav="home">Observatory</a>
      <a href="#daybook" data-nav="daybook">Daybook</a>
      <a href="#paintings" data-nav="paintings">Paintings</a>
      <a href="#birds" data-nav="birds">Birds</a>
      <a href="#listen" data-nav="listen">Listen</a>
      <a href="#seasons" data-nav="seasons">Seasons</a>
      <a href="#explore" data-nav="explore">Explore</a>
    </nav>
  </header>
  <aside class="freshness-strip" id="freshness" aria-label="Site freshness and recorder status">
    <div class="freshness-update"><span class="freshness-label">Site updated</span><span id="site-updated">Checking…</span></div>
    <div class="freshness-recorder"><span class="recorder-badge" id="recorder-badge" data-state="unknown"><i aria-hidden="true"></i><span id="recorder-state">Checking recorder…</span></span><span id="recorder-checked" class="freshness-detail"></span></div>
    <span class="freshness-detail" id="freshness-cadence"></span>
    <button id="refresh-data" class="freshness-refresh" hidden>Newer data available · refresh</button>
    <p id="freshness-notice" class="freshness-notice" role="status" hidden></p>
  </aside>
  <main id="main" tabindex="-1"></main>
  <footer class="colophon" id="colophon"></footer>
  <script id="journal-data" type="application/json">%%DATA%%</script>
  <script src="assets/freshness.js?v=%%FRESHNESS_V%%"></script>
  <script src="assets/site.js?v=%%JS_V%%"></script>
</body>
</html>
