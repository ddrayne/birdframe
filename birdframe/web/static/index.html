<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173c31">
  <meta name="description" content="A living field journal of the birds heard at the window in Edinburgh.">
  <title>birdframe · field journal</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css?v=6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="birdframe">
</head>
<body>
  <a class="skip-link" href="#app">Skip to the journal</a>

  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="#today" aria-label="birdframe today">
        <img src="/icon-192.png" alt="" width="38" height="38">
        <span>
          <strong>birdframe</strong>
          <small>the window field journal</small>
        </span>
      </a>

      <nav class="primary-nav" aria-label="Primary navigation">
        <a href="#today" data-nav="today">Today</a>
        <a href="#journal" data-nav="journal">Journal</a>
        <a href="#species" data-nav="species">Species</a>
        <a href="#patterns" data-nav="patterns">Patterns</a>
        <a href="#pictures" data-nav="pictures">Pictures</a>
      </nav>

      <div class="header-tools">
        <span class="listen-status" id="listenStatus" aria-live="polite">
          <i></i><span>Listening</span>
        </span>
        <a class="icon-link" href="#settings" data-nav="settings" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.25A3.25 3.25 0 1 0 12 8.75a3.25 3.25 0 0 0 0 6.5Zm7.4-2.2c.04-.35.06-.7.06-1.05s-.02-.7-.07-1.05l2.05-1.6-2-3.46-2.54 1.02a8.3 8.3 0 0 0-1.82-1.05L14.7 3.15h-4l-.4 2.71a8.4 8.4 0 0 0-1.82 1.05L5.95 5.89l-2 3.46L6 10.95c-.05.35-.07.7-.07 1.05s.02.7.07 1.05l-2.05 1.6 2 3.46 2.53-1.02c.56.43 1.17.78 1.82 1.05l.4 2.71h4l.39-2.71a8.3 8.3 0 0 0 1.82-1.05l2.54 1.02 2-3.46-2.05-1.6Z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <div class="loading-page" role="status">
      <span class="wingbeat"></span>
      <p>Opening the field journal…</p>
    </div>
  </main>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <a href="#today" data-nav="today"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 17.5h17M7.2 17.5a4.8 4.8 0 0 1 9.6 0M12 6v2.4M5.9 9.4l1.6 1.6M18.1 9.4l-1.6 1.6M3.4 14h1.9M18.7 14h1.9"/></svg></span>Today</a>
    <a href="#journal" data-nav="journal"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.6C10.2 5.2 7.4 4.6 4.5 4.8v12.6c2.9-.2 5.7.4 7.5 1.8 1.8-1.4 4.6-2 7.5-1.8V4.8c-2.9-.2-5.7.4-7.5 1.8Zm0 0v12.6"/></svg></span>Journal</a>
    <a href="#species" data-nav="species"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 4.5C12.3 5 7.9 9.6 7.2 16.4M19.5 4.5c-.8 6.8-5.4 11.2-12.3 11.9L5 19.5M10.5 11.6h5.1M9 14.4h4.2"/></svg></span>Species</a>
    <a href="#patterns" data-nav="patterns"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13.2h3.3l2.2-5.6 3.4 10.6 2.7-7.4 1.8 2.4H21"/></svg></span>Patterns</a>
    <a href="#pictures" data-nav="pictures"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4.5" width="16" height="15" rx="1.6"/><path d="m6.6 16.6 3.7-4.2 2.8 2.9 1.9-2 2.5 3.3"/><circle cx="15.4" cy="8.9" r="1.3"/></svg></span>Pictures</a>
  </nav>

  <div class="audio-dock" id="audioDock" hidden>
    <button type="button" class="audio-toggle" id="audioToggle" aria-label="Pause recording">Ⅱ</button>
    <div class="audio-copy"><strong id="audioTitle">Recording</strong><small id="audioMeta">Your window</small></div>
    <div class="audio-progress"><i id="audioProgress"></i></div>
    <button type="button" class="audio-close" id="audioClose" aria-label="Close player">×</button>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Picture viewer" hidden>
    <button type="button" class="lightbox-close" data-action="close-lightbox" aria-label="Close picture">×</button>
    <img id="lightboxImage" alt="">
    <div><span id="lightboxCaption"></span>
      <div class="lightbox-actions">
        <button type="button" class="lightbox-send" id="lightboxEink" aria-pressed="false" hidden>On the frame</button>
        <button type="button" class="lightbox-send" id="lightboxSend" hidden>Send to frame →</button>
      </div></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/static/js/app.js?v=6"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});</script>
</body>
</html>
